const ITER=250000;
const $=s=>document.querySelector(s);

async function derive(pw){
  const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
  return crypto.subtle.deriveKey({name:"PBKDF2",salt:SALT,iterations:ITER,hash:"SHA-256"},
    base,{name:"AES-GCM",length:256},false,["decrypt"]);
}

async function unlock(pw){
  const key=await derive(pw);
  const plain=await crypto.subtle.decrypt({name:"AES-GCM",iv:IV},key,DATA);
  const obj=JSON.parse(new TextDecoder().decode(plain));
  sessionStorage.setItem("pw",pw);
  render(obj);
}

function render(obj){
  const app=$("#app");
  app.innerHTML="";
  const hd=document.createElement("div"); hd.className="hd";
  const h1=document.createElement("h1"); h1.textContent="SUPREME COP";
  const ok=document.createElement("span"); ok.className="ok"; ok.textContent="decrypted";
  hd.append(h1,ok);
  const st=document.createElement("p"); st.className="steps"; st.textContent=obj.notes.join("\n");
  const pre=document.createElement("pre"); pre.textContent=obj.code;
  const row=document.createElement("div"); row.className="row";
  const cp=document.createElement("button"); cp.textContent="전체 복사";
  const dl=document.createElement("button"); dl.textContent=".user.js 다운로드";
  const lock=document.createElement("button"); lock.textContent="잠그기";
  row.append(cp,dl,lock);
  app.append(hd,st,pre,row);

  cp.onclick=async()=>{ await navigator.clipboard.writeText(pre.textContent); cp.textContent="복사됨"; setTimeout(()=>cp.textContent="전체 복사",1500); };
  dl.onclick=()=>{ const b=new Blob([pre.textContent],{type:"text/javascript"});
    const a=document.createElement("a"); a.href=URL.createObjectURL(b); a.download="supreme-cop.user.js"; a.click(); };
  lock.onclick=()=>{ sessionStorage.removeItem("pw"); location.reload(); };
}

$("#f").onsubmit=async e=>{
  e.preventDefault();
  $("#go").disabled=true; $("#err").textContent="";
  try { await unlock($("#pw").value); }
  catch { $("#err").textContent="비밀번호가 틀렸습니다."; $("#go").disabled=false; }
};

(async()=>{ const saved=sessionStorage.getItem("pw"); if(saved){ try{ await unlock(saved); }catch{} } })();
</script></body></html>
