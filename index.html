const ITER=250000;
const $=s=>document.querySelector(s);

async function open_(pw){
  const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
  const key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:SALT,iterations:ITER,hash:"SHA-256"},
    base,{name:"AES-GCM",length:256},false,["decrypt"]);
  const plain=await crypto.subtle.decrypt({name:"AES-GCM",iv:IV},key,DATA);
  sessionStorage.setItem("pw",pw);
  const o=JSON.parse(new TextDecoder().decode(plain));
  window.__CODE__=o.code;
  document.open(); document.write(o.html); document.close();
}

$("#f").onsubmit=async e=>{
  e.preventDefault();
  $("#go").disabled=true; $("#err").textContent="";
  try { await open_($("#pw").value); }
  catch { $("#err").textContent="비밀번호가 틀렸습니다."; $("#go").disabled=false; }
};

(async()=>{ const s=sessionStorage.getItem("pw"); if(s){ try{ await open_(s); }catch{} } })();
</script></body></html>
