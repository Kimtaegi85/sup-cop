name: droplist

on:
  # GitHub 스케줄러가 이 리포에서 6시간 넘게 안 붙어서 20분 -> 1시간으로 낮추고,
  # 실제 수집은 패널의 "목록 직접 갱신"(r.jina.ai 경유)이 담당한다. 이 워크플로는 백업.
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: droplist
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: fetch
        run: node scripts/fetch-droplist.mjs
      - name: commit if changed
        run: |
          if git diff --quiet -- droplist.json; then
            echo "no change"
            exit 0
          fi
          git config user.name "droplist-bot"
          git config user.email "bot@users.noreply.github.com"
          git add droplist.json
          git commit -m "droplist: auto update"
          git push
